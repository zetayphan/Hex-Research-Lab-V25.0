</style><style>body{background:#0b1220;color:#d9e8ff;font:16px system-ui;margin:0;padding:20px}h1{color:#7ce8e4}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:#17243a;border:1px solid #335070;border-radius:12px;padding:16px}pre{white-space:pre-wrap;word-break:break-word;color:#a9d7ff}a{color:#8fd6ff}.ok{color:#82ecab}.warn{color:#ffcf83}button{padding:10px;background:#315b81;color:white;border:0;border-radius:8px}</style><h1>Hex Unified Research Lab V3</h1><p>Mathematical verification · exact reference models vs live native observations</p><p><a href="/">Studio</a> · <a href="/research">Research V2</a></p><button onclick="refresh()">Refresh now</button><p id="status">Connecting…</p><div class="cards"><section class="card"><h2>Finite reversible reference</h2><pre id="cycle"></pre></section><section class="card"><h2>Structural rank surrogate</h2><pre id="rank"></pre></section><section class="card"><h2>Live native observations</h2><pre id="live"></pre></section><section class="card"><h2>Unverified native claims</h2><pre id="limits"></pre></section></div><script>async function refresh(){try{const r=await fetch('/api/verification',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.querySelector('#cycle').textContent=JSON.stringify(d.reference_permutation,null,2);document.querySelector('#rank').textContent=JSON.stringify(d.structural_rank_surrogate,null,2);document.querySelector('#live').textContent=JSON.stringify(d.live_observation,null,2);document.querySelector('#limits').textContent=JSON.stringify(d.native_engine_claims,null,2);document.querySelector('#status').textContent='Connected · last update '+new Date().toLocaleTimeString()}catch(e){document.querySelector('#status').textContent='Error: '+e.message}}refresh();setInterval(refresh,1500)</script></html>
