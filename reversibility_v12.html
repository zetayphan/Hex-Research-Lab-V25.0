</style><style>body{background:#09111e;color:#e4eefb;font:16px system-ui;margin:0 auto;max-width:950px;padding:24px}section{background:#152339;border:1px solid #34455c;border-radius:14px;padding:20px;margin:14px 0}button,input{padding:12px;border-radius:8px}button{background:#56d5c0;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#80d8ff}</style><h1>V12 · Reversibility Investigation</h1><p>Reference inverse verification and empirical serialized-state repeatability. <strong>Native inversion is not claimed.</strong></p><section><label>Steps <input id="steps" type="number" value="12" min="1" max="100"></label> <button id="run">Run investigation</button> <button id="download" disabled>Download JSON</button></section><section><h2>Results</h2><pre id="out">Pause the simulation, disable bonding/network modes, and stop recording before running.</pre></section><p><a href="/audit-v11">V11 Audit</a> · <a href="/controlled-v10">V10 Replication</a> · <a href="/">Studio</a></p><script>let result=null;document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#out');out.textContent='Investigating…';try{const r=await fetch('/api/v12/investigate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steps:Number(document.querySelector('#steps').value)})});result=await r.json();out.textContent=JSON.stringify(result,null,2);document.querySelector('#download').disabled=!r.ok}catch(e){out.textContent=String(e)}};document.querySelector('#download').onclick=()=>{if(!result)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download='hex_v12_investigation.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></html>
