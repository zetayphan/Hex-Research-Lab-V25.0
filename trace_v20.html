<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V20 Native Multi-Cell Trace</title><style>body{background:#071321;color:#d9f6ff;font:15px system-ui;margin:0}header{background:#10283b;padding:18px}a{color:#8ae9e7;margin-right:15px}main{max-width:1100px;margin:auto;padding:20px}button,input{padding:12px;margin:5px;background:#123c51;color:white;border:1px solid #397e91;border-radius:7px}pre{background:#030b13;color:#a7ffc6;white-space:pre-wrap;overflow:auto;padding:18px;border-radius:12px;max-height:65vh}</style><header><a href="/home">⌂ Home</a><a href="javascript:history.back()">← Back</a><a href="/terminal">Terminal</a><a href="/visualization">Visualization</a></header><main><h1>V20.0 · Simultaneous Native Trace</h1><p>Choose up to 16 cell indices. Traces are captured together during a single native 17-stage evolution step. Pause before configuring.</p><input id="cells" value="0,1,2" aria-label="Cell indices"><button onclick="cmd('pause')">⏸ Pause</button><button onclick="configure()">Arm multi-cell trace</button><button onclick="cmd('step 1').then(load)">⏭ Step Once</button><button onclick="cmd('run')">▶ Run</button><button onclick="load()">Refresh</button><p id="status"></p><pre id="output">Configure tracing and step once to see native calculations.</pre></main><script>
async function request(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||JSON.stringify(j));return j}
async function cmd(command){try{let r=await request('/api/terminal/engine',{command});document.getElementById('status').textContent=JSON.stringify(r).slice(0,400)}catch(e){document.getElementById('status').textContent=e.message}}
async function configure(){try{let cells=document.getElementById('cells').value.split(',').map(x=>Number(x.trim()));let r=await request('/api/v20/trace',{cells});document.getElementById('status').textContent='Armed '+r.configured.join(', ')}catch(e){document.getElementById('status').textContent=e.message}}
async function load(){try{let j=await request('/api/v20/trace');document.getElementById('output').textContent=`TICK ${j.tick} • ${j.stage_count} stages\n`+j.cells.map(c=>`\nCELL ${c.cell}\n`+c.records.map(r=>`STAGE ${String(r.stage).padStart(2,'0')} ${r.name}\n${r.expression}\n`).join('')).join('')}catch(e){document.getElementById('status').textContent=e.message}}
</script></html>
