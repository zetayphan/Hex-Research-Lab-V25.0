<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hex Discovery V6</title><style id="v21-responsive-navigation-fix">
*,*::before,*::after{box-sizing:border-box}
html{max-width:100%;overflow-x:hidden}
body{min-width:0;max-width:100%;overflow-x:hidden}
header,nav,.navbar,.nav,.tabs,.tab-bar,.tabbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:100%;min-width:0;height:auto!important;min-height:0}
header>a,nav>a,.navbar>a,.nav>a,.tabs>a,.tab-bar>a,.tabbar>a,header>button,nav>button,.tabs>button{position:static!important;flex:0 1 auto;max-width:100%;min-width:0;white-space:normal;overflow-wrap:anywhere;line-height:1.3;margin:0}
main,section,article,.panel,.card{min-width:0;max-width:100%}
pre,code{overflow-wrap:anywhere;white-space:pre-wrap}
@media(max-width:650px){header,nav,.navbar,.nav,.tabs,.tab-bar,.tabbar{padding:10px!important;gap:7px!important}header>a,nav>a,.tabs>a,header>button,nav>button,.tabs>button{font-size:13px;padding:8px 10px}main{padding-left:12px!important;padding-right:12px!important}input,select{max-width:100%}}
</style><style>body{background:#091320;color:#dceaff;font:15px system-ui;margin:0;padding:20px}h1{color:#6fffd4}.panel{background:#142437;padding:18px;border-radius:12px;margin:14px 0}button,select{background:#183d4a;color:white;border:1px solid #4c9;padding:9px;border-radius:6px}canvas{width:100%;height:230px;background:#07101b}a{color:#8ef}small{color:#abc}pre{white-space:pre-wrap}</style><h1>Hex Unified Research Lab · Discovery V6</h1><p><a href="/">Studio</a> · <a href="/experiments-v5">Experiments V5</a> · <a href="/verification">Verification</a></p><div class="panel"><h2>Compare historical runs</h2><p>Choose up to eight runs (Ctrl / long press for multiple).</p><select id="runs" multiple size="5" style="width:100%"></select><p><button onclick="load()">Analyze selected runs</button> <button onclick="refresh()">Refresh list</button></p><small>Pattern detection is descriptive, not automatic proof of a new theorem.</small></div><div id="output"></div><script>
const el=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){try{let d=await(await fetch('/api/v5/runs')).json();el('runs').innerHTML=d.runs.map(r=>`<option value="${escapeHtml(r.id)}">${escapeHtml(r.id)}</option>`).join('');if(d.runs.length)el('runs').options[0].selected=true;await load()}catch(e){el('output').textContent=e.message}}
async function load(){let ids=[...el('runs').selectedOptions].map(o=>o.value);if(!ids.length)return;let q=ids.map(x=>'id='+encodeURIComponent(x)).join('&');try{let response=await fetch('/api/v6/discovery?'+q),data=await response.json();if(!response.ok)throw Error(data.error);el('output').innerHTML=data.runs.map((r,i)=>`<section class="panel"><h2>${escapeHtml(r.id)}</h2><p>${r.samples} samples · ${r.steps} steps</p><canvas id="plot${i}" width="850" height="230"></canvas>${r.findings.map(f=>`<h3>${escapeHtml(f.name)}</h3><p>${escapeHtml(f.observed)} · <strong>${escapeHtml(f.status)}</strong></p>`).join('')}<small>${escapeHtml(r.limitations)}</small></section>`).join('');data.runs.forEach((r,i)=>draw(el('plot'+i),r.trajectories))}catch(e){el('output').textContent=e.message}}
function draw(c,rows){let ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let keys=['distinct_hex_values','adjacent_value_transitions','adjacent_rgb_gradient'],colors=['#6fffd4','#ffd26f','#ee91ff'];keys.forEach((k,j)=>{let vals=rows.map(r=>Number(r[k])).filter(Number.isFinite);if(!vals.length)return;let min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;ctx.strokeStyle=colors[j];ctx.beginPath();vals.forEach((v,i)=>{let x=35+i*(w-55)/Math.max(1,vals.length-1),y=h-25-(v-min)/range*(h-60);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=colors[j];ctx.fillText(k,35+j*260,16)})}refresh();</script></html>
