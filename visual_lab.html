<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Hex Visualization</title><style>body{margin:0;background:#07111e;color:#e3f5ff;font:15px system-ui}header{padding:17px 22px;background:#101f30;display:flex;gap:14px;align-items:center;flex-wrap:wrap}a,button{color:#d4faff;background:#16354a;border:1px solid #31758a;border-radius:8px;padding:9px 13px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#24627a}main{max-width:1250px;margin:25px auto;padding:0 16px}.panel{border:1px solid #29526c;border-radius:14px;background:#0b1b2d;padding:20px;margin-bottom:16px}h1{font-size:26px}h2{font-size:19px;color:#8be8eb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.muted{color:#a0b6c5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#020b12;border-radius:8px;padding:14px;max-height:58vh;overflow:auto;color:#8affba;font:13px monospace}input,select{background:#091421;color:white;border:1px solid #356077;padding:9px;border-radius:7px}canvas{width:100%;height:440px;background:#030b16;border-radius:12px} .badge{color:#f7db82}</style><header><b>⬡ HEX UNIFIED RESEARCH LAB · V15 UI</b><a href="/">Home</a><a href="javascript:history.back()">← Back</a><a href="/terminal">Terminal</a><a href="/visualization">Live visualization</a><a href="/stage-lab">Stage lab V18.1</a></header><main><h1>Live native-state visualization</h1><div class="panel"><span id="status">Connecting...</span> <button onclick="setRun(true)">▶ Run</button><button onclick="setRun(false)">⏸ Pause</button><button onclick="stepOnce()">Step once</button><p class="muted">Projected lattice window: every dot represents a sampled native 24-bit RGB cell. Colors come directly from the native hexadecimal values.</p><canvas id="scene"></canvas><p id="details" class="badge"></p></div></main><script>async function get(){let r=await fetch('/api/lab/trace',{cache:'no-store'});if(!r.ok)throw Error('Server '+r.status);return r.json()}async function setRun(v){let r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({running:v})});if(!r.ok)throw Error((await r.json()).error||r.status);await refresh()}async function stepOnce(){await setRun(false);let r=await fetch('/api/step',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error((await r.json()).error||r.status);await refresh()}function buttons(s){document.getElementById('status').textContent='Tick '+s.tick+' · '+(s.running?'RUNNING':'PAUSED')+' · '+s.count+' native cells'}let previous=null;</script><script>const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');function draw(s){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let cells=s.hex,side=Math.ceil(Math.cbrt(cells.length)),points=[];for(let i=0;i<cells.length;i++){let x=i%side,y=Math.floor(i/side)%side,z=Math.floor(i/(side*side));let sx=w/2+(x-y)*Math.min(w/side/3,19),sy=h/2+(x+y-side)*Math.min(h/side/9,7)-(z-side/2)*Math.min(h/side/3,16);points.push({sx,sy,z,color:'#'+cells[i]})}points.sort((a,b)=>a.sy-b.sy);for(let p of points){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.sx,p.sy,Math.max(2,Math.min(5,70/side)),0,Math.PI*2);ctx.fill()}document.getElementById('details').textContent=`Sampled ${cells.length} / ${s.count} cells · tick ${s.tick} · shared engine ${s.running?'running':'paused'}`}async function refresh(){try{let s=await get();buttons(s);draw(s)}catch(e){document.getElementById('status').textContent='Error: '+e.message}}refresh();setInterval(refresh,850);window.addEventListener('resize',refresh)</script></html>
